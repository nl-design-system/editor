plugin:
  js:
    clippy.js:
      preprocess: false
  css:
    component:
      clippy.css: {}
      # TEMP: inject tokens from --basis / --utrecht --nl; to be discussed
      clippy-tokens.css: {}
  dependencies:
    - core/drupal
    - core/ckeditor5
    - ckeditor5/internal.drupal.ckeditor5
    - clippy/drawer-offsets

page-review:
  js:
    clippy-page-review.js:
      preprocess: false
      attributes:
        type: module
  css:
    component:
      clippy-page-review.css: {}
      clippy-page-review-mount.css: {}
  dependencies:
    - core/drupalSettings
    - clippy/drawer-offsets

drawer-offsets:
  js:
    clippy-drawer-offsets.js:
      preprocess: false
      attributes:
        type: module
  css:
    component:
      clippy-drawer-offsets.css: {}
  dependencies:
    - core/drupal
    - core/drupal.displace

olivero:
  css:
    theme:
      clippy-olivero.css: {}
