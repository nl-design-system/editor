clippy.settings:
  type: config_object
  label: "Clippy settings"
  constraints:
    FullyValidatable: ~
  mapping:
    ckeditor:
      type: boolean
      label: "Show accessibility feedback in CKEditor"
    page_review:
      type: boolean
      label: "Show Page review on frontend pages"
    review_root:
      type: string
      label: "Review root selector"
      constraints:
        NotBlank: []
    gutter_always:
      type: boolean
      label: "Always show gutter markers"
