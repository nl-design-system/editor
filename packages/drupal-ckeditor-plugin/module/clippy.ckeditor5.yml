clippy_validation:
  ckeditor5:
    plugins:
      - clippyCkeditor.ClippyPlugin
  drupal:
    label: "Clippy"
    library: "clippy/plugin"
    elements: false
    toolbar_items: {}
    # ckeditor5_essentials is present in every CKEditor5 text format, so this condition is
    # always satisfied and Drupal enables the plugin without per-format configuration.
    conditions:
      plugins:
        - ckeditor5_essentials

clippy_alt_text_wizard:
  ckeditor5:
    plugins:
      - clippyCkeditor.ClippyAltTextWizard
  drupal:
    label: "Alt-text wizard"
    library: "clippy/plugin"
    elements: false
    toolbar_items: {}
    conditions:
      plugins:
        - ckeditor5_image
