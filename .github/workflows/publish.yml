name: publish

on:
  push:
    branches: main

permissions:
  contents: read # since GH_TOKEN is provided, we only need 'read'
  pull-requests: write # Needed to create and update pull requests
  # https://docs.npmjs.com/generating-provenance-statements#publishing-packages-with-provenance-via-github-actions
  id-token: write

jobs:
  publish:
    if: ${{ github.repository != 'nl-design-system/example' }}
    runs-on: ubuntu-latest
    environment: publish

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - name: Install pnpm package manager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js version and cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # pass explicitly for changesets/action authentication with NODE_AUTH_TOKEN
          registry-url: https://registry.npmjs.org

      - name: Check for known security issues with npm packages
        run: |
          echo "Auditing npm dependencies before installing them. For more information, see: https://nldesignsystem.nl/pnpm-audit"
          pnpm audit --audit-level critical

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish to the npm Registry
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        env:
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
          GIT_AUTHOR_NAME: "NL Design System"
          GIT_COMMITTER_EMAIL: ${{ secrets.GIT_COMMITTER_EMAIL }}
          GIT_COMMITTER_NAME: "NL Design System"
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          commit-message: "docs(release): design system packages"
          pr-title: "docs(release): design system packages"
          publish-script: "pnpm run changeset:publish"

      - name: Attach the Drupal module archive to its Release
        if: ${{ steps.changesets.outputs.published == 'true' && contains(fromJSON(steps.changesets.outputs['published-packages']).*.name, '@nl-design-system-community/drupal-ckeditor-plugin') }}
        working-directory: packages/drupal-ckeditor-plugin
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          pnpm run zip
          version=$(jq -r .version package.json)
          gh release upload "@nl-design-system-community/drupal-ckeditor-plugin@${version}" "dist/clippy-drupal-${version}.zip"

      - name: Attach the TYPO3 extension archive to its Release
        if: ${{ steps.changesets.outputs.published == 'true' && contains(fromJSON(steps.changesets.outputs['published-packages']).*.name, '@nl-design-system-community/typo3-ckeditor-plugin') }}
        working-directory: packages/typo3-ckeditor-plugin
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          pnpm run zip
          version=$(jq -r .version package.json)
          gh release upload "@nl-design-system-community/typo3-ckeditor-plugin@${version}" "dist/clippy_${version}.zip"
